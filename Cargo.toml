[package]
name = "utopia-dns"
description = "DNS messages, zones and zone files, resolvers, a server over UDP, TCP and DNS over HTTPS, a client, a recursive lookup and record validators."
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "BSD-3-Clause"

[dependencies]
bytes = "1"
getrandom = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2"] }
php-std = { version = "0.1.0", git = "https://github.com/utopia-rs/php-std" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = { version = "1", features = ["raw_value", "preserve_order", "float_roundtrip"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util", "rt"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
utopia-domains = { version = "0.1.0", git = "https://github.com/utopia-rs/domains" }
utopia-telemetry = { version = "0.1.0", git = "https://github.com/utopia-rs/telemetry", default-features = false }
utopia-validators = { version = "0.1.0", git = "https://github.com/utopia-rs/validators" }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "rt"] }

[package.metadata.utopia]
php-sync = "809d2819d7da00d8b2f486e3bcb4c98a5265e950"